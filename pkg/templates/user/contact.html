{% extends "user/layout.html" %}
{% block title %}Contact Us — Odacity{% endblock %}
{% block main_content %}
<div class="bg-dark text-white py-5 text-center">
    <div class="container py-3">
        <h1 class="display-5 fw-bold mb-3">Contact Odacity</h1>
        <p class="lead text-light opacity-75">16, Ajasa Street, Onikan, Lagos, Nigeria.</p>
    </div>
</div>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm p-4">
                <h4 class="fw-bold mb-3">Send a Message</h4>
                <form action="#" method="post">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Full Name</label>
                        <input type="text" class="form-control" placeholder="Your Name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Email Address</label>
                        <input type="email" class="form-control" placeholder="name@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Message</label>
                        <textarea class="form-control" rows="4" placeholder="How can we help you?" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold">Send Inquiry</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
