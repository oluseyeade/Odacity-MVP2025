<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title or "Admin Sign In | Odacity Command Centre" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap/css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap-icons/font/bootstrap-icons.min.css') }}">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #f8fafc;
        }
        .admin-login-card {
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
            backdrop-filter: blur(10px);
        }
        .brand-badge {
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            color: #ffffff;
            font-weight: 700;
            padding: 0.35rem 0.85rem;
            border-radius: 0.5rem;
            display: inline-block;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            text-transform: uppercase;
        }
        .form-control {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f8fafc;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
        }
        .form-control:focus {
            background: rgba(15, 23, 42, 0.8);
            border-color: #ef4444;
            color: #ffffff;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.25);
        }
        .btn-admin {
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            border: none;
            color: #ffffff;
            font-weight: 600;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            transition: all 0.2s ease;
        }
        .btn-admin:hover {
            background: linear-gradient(135deg, #b91c1c 0%, #7f1d1d 100%);
            color: #ffffff;
        }
        .form-label {
            font-size: 0.875rem;
            font-weight: 500;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

<div class="admin-login-card">
    <div class="text-center mb-4">
        <span class="brand-badge"><i class="bi bi-shield-lock-fill me-1"></i> Odacity Admin</span>
        <h4 class="fw-bold mb-1">Command Centre</h4>
        <p class="text-secondary small">Administrative Governance & Operations Portal</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category if category != 'danger' else 'danger' }} alert-dismissible fade show text-start small mb-4" role="alert">
                    <i class="bi bi-info-circle-fill me-2"></i>{{ message }}
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('admin_login', next=request.args.get('next', '')) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

        <div class="mb-3">
            <label for="email" class="form-label">Administrative Email</label>
            <div class="input-group">
                <span class="input-group-text bg-dark text-secondary border-secondary"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" name="email" placeholder="admin@odacity.com" required autofocus>
            </div>
        </div>

        <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <div class="input-group">
                <span class="input-group-text bg-dark text-secondary border-secondary"><i class="bi bi-key"></i></span>
                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••••••" required>
            </div>
        </div>

        <button type="submit" class="btn btn-admin w-100 mb-3">
            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In to Command Centre
        </button>

        <div class="text-center mt-3 pt-3 border-top border-secondary border-opacity-25">
            <a href="{{ url_for('login') }}" class="text-secondary small text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i>Return to User Portal
            </a>
        </div>
    </form>
</div>

<script src="{{ url_for('static', filename='bootstrap/js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
